<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veckobrev – Interaktiv händelsekarta</title>
  <style>html,body{margin:0;height:100%;font:14px system-ui,sans-serif;background:#e9ecef}.loading{display:grid;place-items:center;height:100%;color:#556}</style>
</head>
<body>
  <div class="loading">Laddar händelsekartan…</div>
  <script>
  (async()=>{
    try{
      const r=await fetch('map-base.html',{cache:'no-cache'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      let html=await r.text();
      html=html.replace('</head>','<link rel="stylesheet" href="mobile.css?v=20260809-1"></head>');
      html=html.replace('</body>','<script src="mobile.js?v=20260809-1"></scr'+'ipt></body>');
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      document.body.innerHTML='<div class="loading">Kartan kunde inte laddas. Försök att uppdatera sidan.</div>';
      console.error(err);
    }
  })();
  </script>
</body>
</html>
